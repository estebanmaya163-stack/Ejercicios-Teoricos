<body>
<!-- Titulos o Encabezados:
se tienen 6 tipos de encabezados, desde el h1 hasta el h6.-->
<!-- (h$*6) crea6 titulos en orden del 1 al 6 Emmet-->
<h1>Titulo</h1>
<!-- El h1 se utiliza una sola vez por pagina wbe esto es debido a que el h1 tiene una importancia en el CEO lo que es el posicionamiento wbe, es decir, google le da mucha importancia al h1  -->
<h2>Subtitulo</h2>
<h3>Subtitulo</h3>
<h4>Subtitulo</h4>
<h5>Subtitulo</h5>
<h6>Subtitulo</h6>
<!-- Desde el h2 hasta el h6; se pueden utulizar las veces que sean necesasrias segun el contenido que se quiera recrear.  -->

<!-- Parrafo: Los parrafos deben tener una idea o punto especifico.
Cada parrafo escrito debe de contener un concepto, una idea. Es decir, puede describir una seccion o un elemento, hasta un mensaje en el chat. Por ejemplo en una seccion se habla sobre los beneficios del ejercicio:
Un parrafo puede tratar de mejorar la salud cardiovascular y otro puede ser sobre los beneficios y cuidados de la salud mental. Finalmente; debe existir un motivo para que exista un parrafo. -->
<p>
    Lorem ipsum dolor sit amet consectetur adipisicing elit. Distinctio delectus quo libero, sint error queas at neque consequuntur id! Labore sequi sapiente cumque velit non, est itaque dolore officia recusandae.
</p>
<!-- (CTRL+SHITF+P) o (ALT+Z) Ajusta el contenido del parrafo a la ventana del editor-->
<!-- Existen algunas tecnologias de asistencia como lectores de pantalla, que ayudan a las personas con discapacidad visual a navegar por el contenido web.
Por ejemplo: cuando estas tecnologias leen el h1 de la pagina, entienden de que trata la pagina por el h1. Por temas de accesibilidad web es importante que se utilice solo un h1 por pagina.-->
